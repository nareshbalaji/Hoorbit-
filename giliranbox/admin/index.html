<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GiliranBox Admin</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{--g:#00b14f;--bg:#f5f6f7;--ink:#1b1b1b;--mut:#6b7280;--line:#e5e7eb}
  *{box-sizing:border-box} body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  header{background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  header b{color:var(--g);font-size:18px} nav{display:flex;gap:4px;flex-wrap:wrap;flex:1}
  nav button{border:0;background:none;padding:8px 12px;border-radius:999px;cursor:pointer;font:inherit}
  nav button.on{background:var(--g);color:#fff}
  main{padding:16px;max-width:1200px;margin:auto} .card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px}
  table{width:100%;border-collapse:collapse} th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--mut);font-weight:600;font-size:12px} input,select,textarea{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px}
  input[type=number]{width:80px} button.act{background:var(--g);color:#fff;border:0;border-radius:8px;padding:6px 10px;cursor:pointer}
  button.red{background:#dc2626} button.gray{background:#6b7280} .tag{padding:2px 8px;border-radius:999px;background:#eef;font-size:12px}
  .pending{background:#fff3cd}.approved{background:#d1fae5}.rejected,.suspended{background:#fee2e2}
  #map{height:520px;border-radius:14px} #login{max-width:340px;margin:80px auto} .row{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  @media(prefers-color-scheme:dark){:root{--bg:#111;--ink:#eee;--line:#333;--mut:#999}header,.card,input,select,textarea{background:#1c1c1c;color:var(--ink)}}
  @media(max-width:700px){table{display:block;overflow-x:auto}}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="admin.js"></script>
</body>
</html>
